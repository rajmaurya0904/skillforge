[project]
name = "skillforge"
version = "0.1.0"
description = "Validates SKILL.md frontmatter, description quality, and referenced files, and runs sample trigger prompts to check the skill's description would actually get selected. For skill authors publishing to directories."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
skillforge = "skillforge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skillforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
